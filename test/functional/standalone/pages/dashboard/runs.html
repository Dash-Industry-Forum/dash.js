<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Runs — dash.js Test Dashboard</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/standalone/styles.css">
    <link rel="stylesheet" href="/dashboard/css/dashboard.css">
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header-bar">
            <div class="logo-area">
                <img src="/img/if.png" alt="DASH-IF">
                <h1>Test Runs</h1>
            </div>
            <div class="header-right">
                <a href="/standalone/index.html" class="btn btn-outline-primary btn-sm" title="Test Runner">
                    <i class="bi bi-play-circle"></i> Test Runner
                </a>
                <select id="theme-select" class="theme-select" aria-label="Theme">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="dashboard-nav">
            <a href="/dashboard/" class="dashboard-nav-item">
                <i class="bi bi-speedometer2"></i> Overview
            </a>
            <a href="/dashboard/runs.html" class="dashboard-nav-item active">
                <i class="bi bi-list-check"></i> Runs
            </a>
            <a href="/dashboard/devices.html" class="dashboard-nav-item">
                <i class="bi bi-display"></i> Devices
            </a>
            <a href="/dashboard/agent.html" class="dashboard-nav-item">
                <i class="bi bi-broadcast"></i> Agent
            </a>
        </nav>

        <!-- Filters -->
        <div class="dashboard-card mb-3">
            <div class="dashboard-card-body">
                <form id="filter-form" class="row g-2 align-items-end">
                    <div class="col-sm-3">
                        <label class="form-label form-label-sm">Device</label>
                        <select id="filter-device" class="form-select form-select-sm">
                            <option value="">All Devices</option>
                        </select>
                    </div>
                    <div class="col-sm-2">
                        <label class="form-label form-label-sm">Status</label>
                        <select id="filter-status" class="form-select form-select-sm">
                            <option value="">All</option>
                            <option value="passed">Passed</option>
                            <option value="failed">Failed</option>
                            <option value="running">Running</option>
                        </select>
                    </div>
                    <div class="col-sm-2">
                        <label class="form-label form-label-sm">From</label>
                        <input type="date" id="filter-from" class="form-control form-control-sm">
                    </div>
                    <div class="col-sm-2">
                        <label class="form-label form-label-sm">To</label>
                        <input type="date" id="filter-to" class="form-control form-control-sm">
                    </div>
                    <div class="col-sm-1">
                        <button type="submit" class="btn btn-primary btn-sm w-100">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                    <div class="col-sm-1">
                        <button type="button" id="btn-reset" class="btn btn-outline-secondary btn-sm w-100">
                            Reset
                        </button>
                    </div>
                    <div class="col-sm-1">
                        <button type="button" id="btn-compare" class="btn btn-outline-info btn-sm w-100" disabled>
                            Compare
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Runs Table -->
        <div class="dashboard-card mb-3">
            <div class="dashboard-card-body p-0" id="runs-container">
                <div class="empty-state"><i class="bi bi-hourglass-split"></i>Loading...</div>
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination-controls"></div>

        <!-- Footer -->
        <div class="footer-bar">
            <div class="footer-inner">
                <img src="/img/if.png" alt="DASH-IF" class="footer-logo">
                <div class="footer-text">
                    <span class="footer-title">dash.js — DASH Industry Forum Reference Client</span>
                    <div class="footer-links">
                        <a href="https://dashif.org" target="_blank" rel="noopener">dashif.org</a>
                        <span class="footer-sep">|</span>
                        <a href="https://github.com/Dash-Industry-Forum/dash.js" target="_blank" rel="noopener">GitHub</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="/dashboard/js/dashboard-common.js"></script>
    <script src="/dashboard/js/runs.js"></script>
</body>
</html>
