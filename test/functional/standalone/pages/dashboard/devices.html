<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices — dash.js Test Dashboard</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/standalone/styles.css">
    <link rel="stylesheet" href="/dashboard/css/dashboard.css">
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header-bar">
            <div class="logo-area">
                <img src="/img/if.png" alt="DASH-IF">
                <h1>Devices</h1>
            </div>
            <div class="header-right">
                <a href="/standalone/index.html" class="btn btn-outline-primary btn-sm" title="Test Runner">
                    <i class="bi bi-play-circle"></i> Test Runner
                </a>
                <select id="theme-select" class="theme-select" aria-label="Theme">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="dashboard-nav">
            <a href="/dashboard/" class="dashboard-nav-item">
                <i class="bi bi-speedometer2"></i> Overview
            </a>
            <a href="/dashboard/runs.html" class="dashboard-nav-item">
                <i class="bi bi-list-check"></i> Runs
            </a>
            <a href="/dashboard/devices.html" class="dashboard-nav-item active">
                <i class="bi bi-display"></i> Devices
            </a>
            <a href="/dashboard/agent.html" class="dashboard-nav-item">
                <i class="bi bi-broadcast"></i> Agent
            </a>
        </nav>

        <!-- Devices Table -->
        <div class="dashboard-card mb-3">
            <div class="dashboard-card-header">
                <i class="bi bi-display"></i> Registered Devices
                <span id="device-count" class="badge bg-secondary ms-2">0</span>
            </div>
            <div class="dashboard-card-body p-0" id="devices-container">
                <div class="empty-state"><i class="bi bi-hourglass-split spin"></i>Loading...</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-bar">
            <div class="footer-inner">
                <img src="/img/if.png" alt="DASH-IF" class="footer-logo">
                <div class="footer-text">
                    <span class="footer-title">dash.js — DASH Industry Forum Reference Client</span>
                    <div class="footer-links">
                        <a href="https://dashif.org" target="_blank" rel="noopener">dashif.org</a>
                        <span class="footer-sep">|</span>
                        <a href="https://github.com/Dash-Industry-Forum/dash.js" target="_blank" rel="noopener">GitHub</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="/dashboard/js/dashboard-common.js"></script>
    <script src="/dashboard/js/devices.js"></script>
</body>
</html>
