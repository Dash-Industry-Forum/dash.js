<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnails</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
</head>
<body>

<script class="code">
    async function init(video, container, wrapper) {
        var url = "https://dash.akamaized.net/akamai/bbb_30fps/bbb_with_multiple_tiled_thumbnails.mpd";

        var player = dashjs.MediaPlayer({}).create();
        player.initialize(video, url, true);

        await createControlBar(player, video, wrapper);
    }
</script>

<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';

    initSamplePage({
        title: 'Thumbnails',
        description: 'Shows how to use streams with thumbnail representations. The thumbnail representation can be dynamically selected in the bitrate selection menu.',
        category: 'Tracks and Capabilities',
        codeExpanded: true,
        videoAttributes: { preload: 'auto', autoplay: '' },
        onInit: (video, container, wrapper) => init(video, container, wrapper)
    });
</script>
</body>
</html>
