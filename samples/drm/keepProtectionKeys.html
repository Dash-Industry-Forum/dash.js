        player = dashjs.MediaPlayer().create();
        player.updateSettings({
            streaming: {
                debug: {

                protection: {

        player.initialize(video, null, true);

        attachSourceButton.onclick = function () {

<div class="sample-warning" id="http-warning" style="display:none"></div>

        description: 'This example shows how to use the keepProtectionKeys setting to persist DRM sessions across source changes. For a detailed explanation on DRM playback in dash.js checkout the <a href="https://dashif.org/dash.js/pages/usage/drm.html" target="_blank">documentation</a>.',
        category: 'DRM',
        onInit: (video, container, wrapper) => init(video, wrapper)
    });
</script>
