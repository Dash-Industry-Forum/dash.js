<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fairplay DRM</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">
</head>
<body>

<script class="code">
    async function init(video, wrapper) {
        var player,
            url = 'https://livesim2.dashif.org/livesim2/drm_EZDRM-1-key-cbcs/testpic_2s/Manifest.mpd';

        player = dashjs.MediaPlayer().create();
        player.initialize(video, url, true);
        await createControlBar(player, video, wrapper);
    }
</script>

<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';
    initSamplePage({
        title: 'Fairplay DRM',
        description: 'This example shows how to use dash.js to play streams with Fairplay DRM protection. Fairplay DRM is typically only available on Apple platforms. In this example the required initialization parameters are signaled in the MPD. For a detailed explanation on DRM playback in dash.js checkout the <a href="https://dashif.org/dash.js/pages/usage/drm.html" target="_blank">documentation</a>.',
        category: 'DRM',
        httpWarning: true,
        codeExpanded: true,
        onInit: (video, container, wrapper) => init(video, wrapper)
    });
</script>
</body>
</html>
