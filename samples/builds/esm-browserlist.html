<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESM browserslist</title>
    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
</head>
<body>
<video autoplay preload="none" controls="true">
    <source src="https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd"
            type="application/dash+xml"/>
</video>
<script class="code" type="module">
    import { MediaPlayer } from '../../dist/modern/esm/dash.all.min.js';

    const player = MediaPlayer().create();
    player.initialize(document.querySelector('video'), 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd', true);
</script>
<script type="module">
    import { initSamplePage } from '../lib/sample-template.js';
    initSamplePage({
        title: 'ESM browserslist',
        description: 'This sample page uses the modern ECMAScript Module build targeting a "browserlist" with the value set to "default". No polyfills are added.',
        category: 'Builds',
        codeExpanded: true,
        layout: 'custom'
    });
</script>
</body>
</html>
