<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CMCD v2 Callbacks with Network Interceptors</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <!-- Bootstrap core CSS -->
    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/main.css" rel="stylesheet">

    <style>
        video {
            width: 640px;
            height: 360px;
        }

        #trace {
            height: 500px;
            margin-top: 20px;
            font-size: 10px;
        }
    </style>
    <script>
        function getKeysForQueryMode(cmcdString) {
                var cmcdData = {};
                var cmcdString = cmcdString;

                extractKeyValuePairs(cmcdString, cmcdData);

                return cmcdData;
            }

            function extractKeyValuePairs(cmcdString, cmcdData) {
                if (cmcdString === '') {
                    return;
                }
                var keyValuePairs = cmcdString.split(',');

                keyValuePairs.forEach(function (keyValuePair) {
                    var data = keyValuePair.split('=');
                    var key = data[0];
                    var value = data[1];

                    cmcdData[key] = value;
                })
            }

            function log(msg) {
                msg = msg.length > 200 ? msg.substring(0, 200) + '...' : msg; /* to avoid repeated wrapping with large objects */
                var tracePanel = document.getElementById('trace');
                tracePanel.innerHTML += msg + '\n';
                tracePanel.scrollTop = tracePanel.scrollHeight;
            }
    </script> 
    <script class="code">
        /* CMCD v2 transmission modes:
         * - Request Mode: uses 'query' or 'header' (configurable via settings.streaming.cmcd.mode)
         * - Event Mode (eventTargets): always uses 'body' (POST request) - mode is not configurable per target
         */
        var CMCD_MODE_QUERY = 'query'; /* as query parameters (Request Mode only) */
        var player;

        function init() {
            var video,
                url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd',
                version;

            player = dashjs.MediaPlayer().create();
            video = document.querySelector('video');
            player.initialize();
            const reportingUrl = 'http://localhost:3333/cmcd/response-received'

            player.updateSettings({
                streaming: {
                    cmcd: {
                        version: 2,
                        enabled: true, /* enable reporting of cmcd parameters */
                        sid: 'b248658d-1d1a-4039-91d0-8c08ba597da5', /* session id send with each request */
                        cid: '21cf726cfe3d937b5f974f72bb5bd06a', /* content id send with each request */
                        mode: CMCD_MODE_QUERY,
                        enabledKeys: ['cid', 'sid'],
                        includeInRequests: ['segment', 'mpd'],
                        eventTargets: [
                            {
                                enabled: true,
                                url: reportingUrl,
                                enabledKeys: ['e', 'rc', 'url'],
                                events: ['rr']
                            },
                        ]
                    }
                }
            });
            player.setAutoPlay(false);
            player.attachView(video);
            player.attachSource(url);

            /* Callback before report - Event Mode uses POST body */
            player.addRequestInterceptor((request) => {
                /* Only modify requests to our report endpoint that contain 'rr' (response received) event */
                const isReportEndpoint = request.customData.request.type == 'CmcdEvent' && request.url.includes(reportingUrl);
                const hasRrEvent = request.body && decodeURIComponent(request.body).includes('e=rr');

                if (isReportEndpoint && hasRrEvent) {
                    let customKey = 'synchronization-leader-sid';
                    let customKeyValue = '123'
                    let { cmcd } = request;
                    if (cmcd) {
                        /*  Add custom key to cmcd data */
                        cmcd[customKey] = customKeyValue;
                        /*  Add custom key to body (Event Mode uses POST body) */
                        if (request.body) {
                            let newParam = encodeURIComponent(`,${customKey}="${customKeyValue}"`);
                            request.body += newParam;
                        }
                    }
                }
                return Promise.resolve(request);
            });

            /* Callback after server response */
            player.addResponseInterceptor((response) => {
                const request = response.request.customData.request;
                /* Only log requests to our report endpoint that contain 'rr' (response received) event */
                const isReportEndpoint = request.type == 'CmcdEvent' && request.url.includes('http://localhost:3003/report');
                const hasRrEvent = request.body && decodeURIComponent(request.body).includes('e=rr');

                if (isReportEndpoint && hasRrEvent) {
                    console.log(request.cmcd);
                }
                return Promise.resolve(response);
            });

            /* Intercept XHR to log CMCD body data (Event Mode uses POST body) */
            const originalSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.send = function(body) {
                if (this._cmcdReportUrl) {
                    const cmcdString = decodeURIComponent(body);
                    const data = getKeysForQueryMode(cmcdString);
                    var keys = Object.keys(data);
                    keys = keys.sort();
                    for (var key of keys) {
                        log(key.padEnd(4) + ': ' + data[key]);
                    }
                    log('');
                }
                return originalSend.call(this, body);
            };

            const originalOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                /* Mark requests to report endpoint for body logging */
                if (url.includes('report')) {
                    this._cmcdReportUrl = true;
                }
                return originalOpen.call(this, method, url, ...rest);
            };
        }
    </script>
</head>
<body>

<main>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <img class=""
                 src="../lib/img/dashjs-logo.png"
                 width="200">
        </header>
        <div class="row">
            <div class="col-md-12">
                <div class="h-100 p-5 bg-light border rounded-3">
                    <h3>CMCD v2 Callbacks with Network Interceptors</h3>
                    <p>This sample shows how to use Network Interceptors to execute callbacks after server response or pre-request callbacks for Response and Event Mode</p>
                </div>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-6">
                <video controls="true"></video>
            </div>
            <div class="col-md-6">
                <div class="form-floating">
                    <textarea class="form-control" placeholder="Sent CMCD data will be displayed here"
                              id="trace"></textarea>
                    <label for="trace">CMCD Report Data</label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div id="code-output"></div>
            </div>
        </div>
        <footer class="pt-3 mt-4 text-muted border-top">
            &copy; DASH-IF
        </footer>
    </div>
</main>


<script>
    document.addEventListener('DOMContentLoaded', function () {
        init();
    });
</script>
<script src="../highlighter.js"></script>
</body>
</html>
