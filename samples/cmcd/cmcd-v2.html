<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CMCD v2 Reporting</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <!-- Bootstrap core CSS -->
    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/main.css" rel="stylesheet">

    <style>
        video {
            width: 640px;
            height: 360px;
        }

        #trace {
            height: 300px;
            font-size: 10px;
        }

        #cmcd-config {
            height: 300px;
            font-family: monospace;
            font-size: 12px;
        }

        .source-input-group {
            width: 640px;
            margin: 0 auto;
        }
    </style>

    <script class="code">
        var CMCD_DATA_GENERATED = dashjs.MetricsReporting.events.CMCD_DATA_GENERATED;

        /* CMCD v2 transmission modes:
         * - Request Mode: uses 'query' or 'header' (configurable via settings.streaming.cmcd.mode)
         * - Event Mode (targets): always uses 'body' (POST request) - mode is not configurable per target
         */
        var CMCD_MODE_QUERY = 'query'; /* as query parameters (Request Mode only) */
        var CMCD_MODE_HEADER = 'header'; /* as HTTP headers (Request Mode only) */
        var CMCD_MODE_BODY = 'body'; /* as body of request (Event Mode only) */
        var player;
        var defaultSourceUrl = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';

        var defaultCmcdConfig = {
            version: 2,
            enabled: true,
            sid: 'b248658d-1d1a-4039-91d0-8c08ba597da5',
            cid: '21cf726cfe3d937b5f974f72bb5bd06a',
            mode: CMCD_MODE_QUERY,
            enabledKeys: ['br', 'd', 'ot', 'tb', 'bl', 'dl', 'mtp', 'nor', 'nrr', 'su', 'bs', 'rtp', 'cid', 'pr', 'sf', 'sid', 'st', 'v', 'msd'],
            targets: [
                {
                    enabled: true,
                    url: 'http://localhost:3001/cmcd/response-received',
                    enabledKeys: ['url', 'rc', 'msd'],
                    includeOnRequests: ['mpd', 'segment'],
                    events: ['rr']
                },
                {
                    enabled: true,
                    url: 'http://localhost:3002/cmcd/event-mode',
                    timeInterval: 10,
                    enabledKeys: ['e', 'msd', 'sta'],
                    events: ['ps', 'e', 't']
                },
                {
                    enabled: true,
                    url: 'http://localhost:3003/cmcd/event-mode',
                    timeInterval: 6
                },
                {
                    enabled: true,
                    url: 'http://localhost:3004/cmcd/event-body-mode',
                    batchSize: 3
                }
            ]
        };

        function init() {
            var video;

            player = dashjs.MediaPlayer().create();
            video = document.querySelector('video');
            player.initialize();

            player.on(CMCD_DATA_GENERATED, handleCmcdDataGeneratedEvent);

            // Initialize source input with default URL
            document.getElementById('source-url').value = defaultSourceUrl;

            // Initialize config textarea with default config
            document.getElementById('cmcd-config').value = JSON.stringify(defaultCmcdConfig, null, 2);

            player.updateSettings({
                streaming: {
                    cmcd: defaultCmcdConfig
                }
            });
            player.setAutoPlay(false);
            player.attachView(video);
            player.attachSource(defaultSourceUrl);
        }

        function loadSource() {
            var url = document.getElementById('source-url').value.trim();
            if (url) {
                player.attachSource(url);
                log('Source loaded: ' + url);
            }
        }

        function applyCmcdSettings() {
            var configTextarea = document.getElementById('cmcd-config');
            try {
                var cmcdConfig = JSON.parse(configTextarea.value);
                player.updateSettings({
                    streaming: {
                        cmcd: cmcdConfig
                    }
                });
                log('CMCD settings applied successfully');
                configTextarea.style.borderColor = '';
            } catch (e) {
                log('Error parsing JSON: ' + e.message);
                configTextarea.style.borderColor = 'red';
            }
        }

        function resetCmcdSettings() {
            document.getElementById('cmcd-config').value = JSON.stringify(defaultCmcdConfig, null, 2);
            document.getElementById('cmcd-config').style.borderColor = '';
            applyCmcdSettings();
        }

        function handleCmcdDataGeneratedEvent(event) {
            log('type: ' + event.mediaType);
            log('file: ' + event.url.split('/').pop())
            var mode = event.mode;
            var data;

            switch (mode) {
                case CMCD_MODE_HEADER:
                    data = getKeysForHeaderMode(event);
                    break;
                case CMCD_MODE_BODY:
                    data = getKeysForJsonMode(event);
                    break;
                default:
                    data = getKeysForQueryMode(event);
            }

            var keys = Object.keys(data);
            keys = keys.sort();
            for (var key of keys) {
                log(key.padEnd(4) + ': ' + event.cmcdData[key]);
            }
            log('');
        }

        function getKeysForQueryMode(event) {
            var cmcdData = {};
            var cmcdString = event.cmcdString;

            extractKeyValuePairs(cmcdString, cmcdData);

            return cmcdData;
        }

        function getKeysForHeaderMode(event) {
            var cmcdData = {};
            var keys = Object.keys(event.headers);

            for (var key of keys) {
                extractKeyValuePairs(event.headers[key], cmcdData)
            }

            return cmcdData
        }

        function getKeysForJsonMode(event){
            const decoded = decodeURIComponent(event.cmcdString);
            const entries = decoded.split(',');

            const cmcdData = {};

            for (let entry of entries) {
                let [key, value] = entry.split('=');

                if (value?.startsWith('"') && value.endsWith('"')) {
                value = value.slice(1, -1);
                }

                if (!isNaN(value) && value.trim() !== '') {
                value = Number(value);
                }

                cmcdData[key] = value;
            }
            return cmcdData;
        }

        function extractKeyValuePairs(cmcdString, cmcdData) {
            if (cmcdString === '') {
                return;
            }
            var keyValuePairs = cmcdString.split(',');

            keyValuePairs.forEach(function (keyValuePair) {
                var data = keyValuePair.split('=');
                var key = data[0];
                var value = data[1];

                cmcdData[key] = value;
            })

        }

        function log(msg) {
            msg = msg.length > 200 ? msg.substring(0, 200) + '...' : msg; /* to avoid repeated wrapping with large objects */
            var tracePanel = document.getElementById('trace');
            tracePanel.innerHTML += msg + '\n';
            tracePanel.scrollTop = tracePanel.scrollHeight;
            console.log(msg);
        }

        // Simulate a PLAYBACK_ERROR after 5 seconds
        // setTimeout(() => {
        //     console.warn("⏱️ Simulating PLAYBACK_ERROR after timeout...");
        //     player.trigger('playbackError', {
        //         error: "custom",
        //         event: "timeoutError",
        //         message: "Simulated timeout-based playback failure"
        //     });
        // }, 15000);

    </script>
</head>
<body>

<main>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <img class=""
                 src="../lib/img/dashjs-logo.png"
                 width="200">
        </header>
        <div class="row">
            <div class="col-md-12">
                <div class="h-100 p-5 bg-light border rounded-3">
                    <h3>CMCD v2 Reporting</h3>
                    <p>This sample shows how to use dash.js in order to enhance requests to the CDN with Common Media
                        Client Data (CMCD - CTA 5004).</p>
                </div>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-12">
                <div class="input-group source-input-group">
                    <input type="text" class="form-control" id="source-url" placeholder="Enter MPD URL">
                    <button class="btn btn-primary" onclick="loadSource()">Load</button>
                </div>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-12 text-center">
                <video controls="true"></video>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6">
                <label for="cmcd-config" class="form-label"><strong>CMCD Configuration (streaming.cmcd)</strong></label>
                <textarea class="form-control" id="cmcd-config" placeholder="Enter CMCD JSON configuration"></textarea>
                <div class="mt-2">
                    <button class="btn btn-primary" onclick="applyCmcdSettings()">Apply Settings</button>
                    <button class="btn btn-secondary" onclick="resetCmcdSettings()">Reset to Default</button>
                </div>
            </div>
            <div class="col-md-6">
                <label for="trace" class="form-label"><strong>CMCD Data</strong></label>
                <textarea class="form-control" placeholder="Sent CMCD data will be displayed here" id="trace"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div id="code-output"></div>
            </div>
        </div>
        <footer class="pt-3 mt-4 text-muted border-top">
            &copy; DASH-IF
        </footer>
    </div>
</main>


<script>
    document.addEventListener('DOMContentLoaded', function () {
        init();
    });
</script>
<script src="../highlighter.js"></script>
</body>
</html>
