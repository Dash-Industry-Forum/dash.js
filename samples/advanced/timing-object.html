<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronization with a TimingObject</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
</head>
<body>

<div class="sample-content-custom">
    <div class="row mt-2">
        <div class="col-md-8">
            <video></video>
            <br>
            <button id="play" disabled type="button">play</button>
            <button id="pause" disabled type="button">pause</button>
        </div>
    </div>
</div>

<script class="code" type="module">
    window.init = () => {
        const player = dashjs.MediaPlayer().create();
        const url = "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd";
        const video = document.querySelector("video");

        player.initialize(video, url, false);

        const pauseButton = document.getElementById("pause");
        const playButton = document.getElementById("play");

        Promise.all([
            import('https://jspm.dev/npm:timing-object'),
            import('https://jspm.dev/npm:timing-provider'),
            import('https://jspm.dev/npm:timingsrc')
        ]).then(([{ TimingObject }, { TimingProvider }, { setTimingsrc }]) => {
            const timingObject = new TimingObject(new TimingProvider('V7X4LuPQMgtuspLtLy4i'));

            pauseButton.addEventListener('click', () => {
                pauseButton.disabled = true;
                playButton.disabled = false;
                timingObject.update({ velocity: 0 });
            });

            playButton.addEventListener('click', () => {
                playButton.disabled = true;
                pauseButton.disabled = false;
                timingObject.update({ velocity: 1 });
            });

            timingObject.addEventListener('change', () => {
                const { velocity } = timingObject.query();

                if (velocity === 0) {
                    pauseButton.disabled = true;
                    playButton.disabled = false;
                } else {
                    playButton.disabled = true;
                    pauseButton.disabled = false;
                }
            });

            timingObject.addEventListener('readystatechange', () => {
                if (timingObject.readyState === 'open') {
                    playButton.disabled = false;

                    setTimingsrc(video, timingObject);
                }
            });

            video.addEventListener('ended', () => {
                pauseButton.disabled = true;
                playButton.disabled = false;
                timingObject.update({ position: 0 });
            });
        });
    }
</script>
<script type="module">
    import { initSamplePage } from '../lib/sample-template.js';
    initSamplePage({
        title: 'Synchronization with a TimingObject',
        description: 'An example which shows how to connect a TimingObject (as defined in the <a href="https://webtiming.github.io/timingobject/">Timing Object specification</a>) to a dash.js player to synchronize playback across devices. When opening this page in multiple tabs or browsers the playback should be in sync.',
        category: 'Loading and Startup',
        layout: 'custom',
        onInit: () => init()
    });
</script>
</body>
</html>
