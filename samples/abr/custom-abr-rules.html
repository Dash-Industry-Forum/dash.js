<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom ABR rules</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">

    <script src="LowestBitrateRule.js" class="code"></script>
</head>
<body>

<script class="code">
    async function init(video, wrapper) {
        var player,
            url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';

        player = dashjs.MediaPlayer().create();

        /* don't use dash.js default rules */
        player.updateSettings({
            streaming: {
                abr: {
                    rules: {
                        throughputRule: { active: false },
                        bolaRule: { active: false },
                        insufficientBufferRule: { active: false },
                        switchHistoryRule: { active: false },
                        droppedFramesRule: { active: false },
                        abandonRequestsRule: { active: false }
                    }
                }
            }
        });

        /* add custom quality switch rule - see LowestBitrateRule.js */
        player.addABRCustomRule('qualitySwitchRules', 'LowestBitrateRule', LowestBitrateRule);

        player.initialize(video, url, true);
        await createControlBar(player, video, wrapper);
    }
</script>

<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';

    initSamplePage({
        title: 'Custom ABR rules',
        description: 'Shows how to create and define custom ABR rules in dash.js. All default rules are disabled and a custom LowestBitrateRule is used instead.',
        category: 'ABR',
        codeExpanded: true,
        onInit: (video, container, wrapper) => init(video, wrapper)
    });
</script>
</body>
</html>
