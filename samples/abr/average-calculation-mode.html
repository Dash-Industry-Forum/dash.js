<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Average throughput calculation mode</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">
</head>
<body>

<script class="code">
    async function init(video, wrapper) {
        var player,
            url = "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd";

        player = dashjs.MediaPlayer().create();

        player.updateSettings({
            streaming: {
                abr: {
                    throughput: {
                        averageCalculationMode: dashjs.Constants.THROUGHPUT_CALCULATION_MODES.BYTE_SIZE_WEIGHTED_HARMONIC_MEAN,
                        sampleSettings: {
                            vod: 5,
                            enableSampleSizeAdjustment: false
                        }
                    },
                }
            }
        });

        player.initialize(video, url, true);
        await createControlBar(player, video, wrapper);

        // Poll the throughput calculated by the ThroughputController using the
        // configured averageCalculationMode. getAverageThroughput() returns kbit/s.
        var throughputPoller = setInterval(function () {
            var videoThroughput = Math.round(player.getAverageThroughput('video') || 0);
            var audioThroughput = Math.round(player.getAverageThroughput('audio') || 0);
            document.getElementById('throughputVideo').innerText = videoThroughput + ' kbit/s';
            document.getElementById('throughputAudio').innerText = audioThroughput + ' kbit/s';
        }, 1000);

        player.on(dashjs.MediaPlayer.events.PLAYBACK_ENDED, function () {
            clearInterval(throughputPoller);
        });
    }
</script>

<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';

    var content = document.createElement('div');
    content.innerHTML = `
        <div class="sample-content">
            <div class="sample-content-main">
                <div class="sample-video-wrapper" id="video-wrapper">
                    <video></video>
                </div>
            </div>
            <div class="sample-content-side">
                <div class="sample-metrics">
                    <div class="sample-metrics-header">Metrics</div>
                    <div class="sample-metrics-body">
                        <div class="metric-row">
                            <span class="metric-label">Calculated throughput (video)</span>
                            <span class="metric-value" id="throughputVideo">-</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Calculated throughput (audio)</span>
                            <span class="metric-value" id="throughputAudio">-</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Calculation mode</span>
                            <span class="metric-value" id="calcMode" style="white-space: normal; word-break: break-word;">BYTE_SIZE_WEIGHTED_HARMONIC_MEAN</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;

    initSamplePage({
        title: 'Average throughput calculation mode',
        description: 'dash.js provides multiple options to configure the calculation of the current average throughput, an important input for most ABR rules. This example changes the default mode to byte size weighted harmonic mean, sets the number of samples to five, and disables automatic sample size adjustment. The calculated throughput reported by the ThroughputController is shown live in the metrics panel.',
        category: 'ABR',
        codeExpanded: true,
        layout: 'custom',
        content: content,
        onInit: (video, container, wrapper) => init(video, wrapper)
    });
</script>
</body>
</html>
