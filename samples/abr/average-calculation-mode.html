<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Average Throughput Calculation Mode</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">
</head>
<body>

<script class="code">
    async function init(video, wrapper) {
        var player,
            url = "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd";

        player = dashjs.MediaPlayer().create();

        player.updateSettings({
            streaming: {
                abr: {
                    throughput: {
                        averageCalculationMode: dashjs.Constants.THROUGHPUT_CALCULATION_MODES.BYTE_SIZE_WEIGHTED_HARMONIC_MEAN,
                        sampleSettings: {
                            vod: 5,
                            enableSampleSizeAdjustment: false
                        }
                    },
                }
            }
        });

        player.initialize(video, url, true);
        await createControlBar(player, video, wrapper);
    }
</script>

<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';

    initSamplePage({
        title: 'Average Throughput Calculation Mode',
        description: 'dash.js provides multiple options to configure the calculation of the current average throughput, an important input for most ABR rules. This example changes the default mode to byte size weighted harmonic mean, sets the number of samples to five, and disables automatic sample size adjustment.',
        category: 'ABR',
        onInit: (video, container, wrapper) => init(video, wrapper)
    });
</script>
</body>
</html>
