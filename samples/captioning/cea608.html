<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEA 608/708 embedded captions</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
</head>
<body>

<script class="code">
    async function init(video, container, wrapper) {
        var url = "https://livesim2.dashif.org/vod/testpic_2s/cea608.mpd";

        var player = dashjs.MediaPlayer().create();
        player.initialize(video, url, true);
        player.attachTTMLRenderingDiv(wrapper.querySelector('#ttml-rendering-div'));

        await createControlBar(player, video, wrapper);
    }
</script>

<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';

    initSamplePage({
        title: 'CEA 608/708 embedded captions',
        description: 'This example shows how content with embedded CEA 608/708 captions can be played back by the dash.js player.',
        category: 'Subtitles and Captions',
        codeExpanded: true,
        ttmlRenderingDiv: true,
        videoAttributes: { preload: 'auto', autoplay: '' },
        onInit: (video, container, wrapper) => init(video, container, wrapper)
    });
</script>
</body>
</html>
