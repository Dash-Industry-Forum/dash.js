<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Audio - Initial Track</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">
</head>
<body>

<script class="code">
    async function init(video, wrapper) {
        var player,
            url = "https://media.axprod.net/TestVectors/v7-Clear/Manifest_1080p.mpd";
        var attachSourceButton = document.getElementById('attach_button');

        player = dashjs.MediaPlayer().create();
        player.updateSettings({
            streaming: {
                debug: {
                    logLevel: 5
                }
            }
        })
        player.initialize(video, null, false);
        await createControlBar(player, video, wrapper);

        attachSourceButton.onclick = function () {
            player.attachSource(url);
            player.setInitialMediaSettingsFor('audio', {
                lang: 'et-ET'
            })
            player.play();
        }
    }

    function check() {
        if (location.protocol === 'http:' && location.hostname !== 'localhost') {
            var out = 'This page has been loaded under http. This might result in the EME APIs not being available to the player and any DRM-protected content will fail to play. ' +
                'If you wish to test manifest URLs that require EME support, then <a href=\'https:' + window.location.href.substring(window.location.protocol.length) + '\'>reload this page under https</a>.'
            var div = document.getElementById('http-warning');
            div.innerHTML = out;
            div.style.display = ''
        }
    }
</script>

<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';

    var content = document.createElement('div');
    content.innerHTML = `
        <div class="sample-content">
            <div class="sample-content-main">
                <div class="alert alert-danger" role="alert" style="display: none" id="http-warning"></div>
                <div class="sample-video-wrapper" id="video-wrapper">
                    <video></video>
                </div>
                <div style="margin-top: 0.5rem;">
                    <button class="btn btn-sm btn-primary" id="attach_button">(Re)attach Source</button>
                </div>
            </div>
        </div>
    `;

    initSamplePage({
        title: 'Multi Audio - Initial Track',
        description: 'This example illustrates how to select a default audio language for playback.',
        category: 'Multi-Audio',
        layout: 'custom',
        content: content,
        onInit: async () => {
            var video = document.querySelector('video');
            var wrapper = document.getElementById('video-wrapper');
            check();
            await init(video, wrapper);
        }
    });
</script>
</body>
</html>
