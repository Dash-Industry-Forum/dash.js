<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple audio tracks</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
</head>
<body>

<script class="code">
    async function init(video, container, wrapper) {
        var url = 'https://media.axprod.net/TestVectors/v7-Clear/Manifest_1080p.mpd';

        var player = dashjs.MediaPlayer().create();
        player.initialize(video, url, true);
        player.setInitialMediaSettingsFor('audio', {
            lang: 'et-ET'
        })

        await createControlBar(player, video, wrapper);
    }
</script>

<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';

    initSamplePage({
        title: 'Multiple audio tracks',
        description: 'This example shows how content with multiple audio tracks can be played back by the dash.js player. dash.js allows a switch of the audio track during playback.',
        category: 'Tracks and Capabilities',
        codeExpanded: true,
        videoAttributes: { preload: 'auto', autoplay: '' },
        onInit: (video, container, wrapper) => init(video, container, wrapper)
    });
</script>
</body>
</html>
