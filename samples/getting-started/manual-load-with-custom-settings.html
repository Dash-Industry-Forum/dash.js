<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual load with custom settings</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">
</head>
<body>

<script class="code">
    async function init(video, wrapper) {
        var player,
            url = "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd";

        player = dashjs.MediaPlayer().create();
        player.initialize(); /* initialize the MediaPlayer instance */

        player.updateSettings({
            'debug': {
                'logLevel': dashjs.Debug.LOG_LEVEL_NONE  /* turns off console logging */
            },
            'streaming': {
                'scheduling': {
                    'scheduleWhilePaused': false,   /* stops the player from loading segments while paused */
                },
                'buffer': {
                    'fastSwitchEnabled': true   /* enables buffer replacement when switching bitrates for faster switching */
                }
            }
        });
        player.setAutoPlay(false); /* remove this line if you want the player to start automatically on load */
        player.attachView(video); /* tell the player which videoElement it should use */
        player.attachSource(url); /* provide the manifest source */
        await createControlBar(player, video, wrapper);
    }
</script>

<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';

    initSamplePage({
        title: 'Manual load with custom settings',
        description: 'A sample showing how to load a video using custom settings.',
        category: 'Getting Started',
        codeExpanded: true,
        onInit: (video, container, wrapper) => init(video, wrapper)
    });
</script>
</body>
</html>
