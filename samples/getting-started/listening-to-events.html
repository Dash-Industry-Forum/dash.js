<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening to events</title>

    <script src="../../dist/modern/umd/dash.all.debug.js"></script>

    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">
</head>
<body>

<script class="code">
    var player, firstLoad = true;

    function init() {
        player = dashjs.MediaPlayer().create();
        player.updateSettings({ 'debug': { 'logLevel': dashjs.Debug.LOG_LEVEL_NONE }});
    }

    function showEvent(e) {
        log("Event received: " + e.type);
        for (var name in e) {
            if (typeof e[name] != 'object') {
                log("    " + name + ": " + e[name]);
            }
        }
        for (var name in e) {
            if (typeof e[name] == 'object') {
                log("    " + name + ":");
                for (var name2 in e[name]) {
                    log("        " + name2 + ": " + JSON.stringify(e[name][name2]));
                }
            }
        }
    }

    function log(msg) {
        msg = msg.length > 90 ? msg.substring(0, 90) + "..." : msg;
        var tracePanel = document.getElementById("trace");
        tracePanel.innerHTML += msg + "\n";
        tracePanel.scrollTop = tracePanel.scrollHeight;
    }

    function setListener(eventName) {
        player.on(dashjs.MediaPlayer.events[eventName], showEvent);
        var element = document.createElement("input");
        element.type = "button";
        element.className = "btn btn-sm btn-outline-danger";
        element.id = eventName;
        element.value = "Remove " + eventName;
        element.onclick = function () {
            player.off(dashjs.MediaPlayer.events[eventName], showEvent);
            document.getElementById("eventHolder").removeChild(element);
        };
        document.getElementById("eventHolder").appendChild(element);
    }

    async function load(button) {
        var url = "https://livesim2.dashif.org/livesim2/scte35_2/testpic_2s/Manifest.mpd";

        if (!firstLoad) {
            player.attachSource(url);
        } else {
            firstLoad = false;
            button.value = "RELOAD PLAYER";
            var video = document.querySelector("video");
            player.initialize(video, url, true);
            await createControlBar(player, video, document.getElementById('video-wrapper'));
        }
        document.getElementById("trace").innerHTML = "";
    }
</script>

<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';

    // Build custom content for this sample
    var content = document.createElement('div');
    content.innerHTML = `
        <div class="sample-content">
            <div style="flex: 0 0 240px; min-width: 0;">
                <div class="sample-side-panel">
                    <div class="sample-side-panel-header">Select Events</div>
                    <div class="sample-side-panel-body">
                        <p style="font-size:0.8rem; color:var(--rp-text-muted); margin-bottom:0.5rem;">Choose events to monitor before starting playback:</p>
                        <select class="form-select form-select-sm" id="availableEvents" onchange="setListener(this.options[this.selectedIndex].text)">
                            <option selected disabled>Select an event ..</option>
                            <option>BUFFER_EMPTY</option>
                            <option>BUFFER_LOADED</option>
                            <option>CAN_PLAY</option>
                            <option>DYNAMIC_TO_STATIC</option>
                            <option>ERROR</option>
                            <option>LOG</option>
                            <option>MANIFEST_LOADED</option>
                            <option>METRIC_ADDED</option>
                            <option>METRIC_CHANGED</option>
                            <option>METRIC_UPDATED</option>
                            <option>METRICS_CHANGED</option>
                            <option>PERIOD_SWITCH_COMPLETED</option>
                            <option>PERIOD_SWITCH_STARTED</option>
                            <option>PLAYBACK_ENDED</option>
                            <option>PLAYBACK_ERROR</option>
                            <option>PLAYBACK_METADATA_LOADED</option>
                            <option>PLAYBACK_PAUSED</option>
                            <option>PLAYBACK_PLAYING</option>
                            <option>PLAYBACK_PROGRESS</option>
                            <option>PLAYBACK_RATE_CHANGED</option>
                            <option>PLAYBACK_SEEKED</option>
                            <option>PLAYBACK_SEEKING</option>
                            <option>PLAYBACK_STARTED</option>
                            <option>PLAYBACK_TIME_UPDATED</option>
                            <option>PLAYBACK_WAITING</option>
                            <option>STREAM_UPDATED</option>
                            <option>STREAM_INITIALIZED</option>
                            <option>TEXT_TRACK_ADDED</option>
                            <option>TEXT_TRACKS_ADDED</option>
                        </select>
                        <div style="margin-top:0.5rem;">
                            <strong style="font-size:0.75rem; color:var(--rp-text-muted);">Active:</strong>
                            <div id="eventHolder" style="display:flex; flex-wrap:wrap; gap:4px; margin-top:4px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="sample-content-main">
                <div class="sample-video-wrapper" id="video-wrapper">
                    <video></video>
                </div>
                <div style="margin-bottom:0.5rem;">
                    <input type="button" class="btn btn-sm btn-primary" value="Load" onclick="load(this)"/>
                </div>
                <textarea class="sample-log" placeholder="Trapped events will be displayed here" id="trace"></textarea>
            </div>
        </div>
    `;

    initSamplePage({
        title: 'Listening to events',
        description: 'Example showing how to listen to events raised by dash.js. This sample allows you to explore the various external events accessible from MediaPlayer. Events can be dynamically added and removed.',
        category: 'Getting Started',
        layout: 'custom',
        content: content,
        onInit: () => init()
    });
</script>
</body>
</html>
