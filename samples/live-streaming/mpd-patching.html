<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live stream with MPD patching</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">

</head>
<body>

<div class="sample-content-custom">
    <div class="row mt-4">
        <div class="col-md-7">
            <div class="sample-video-wrapper"><video></video></div>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="sample-metrics">
                <div class="sample-metrics-header">Last MPD update</div>
                <div class="sample-metrics-body">
                    <pre id="output-container" class="sample-log mb-0"></pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script class="code">
    var outputContainer;

    async function init() {
        var video,
            player,
            url = 'https://livesim2.dashif.org/livesim2/segtimeline_1/patch_60/testpic_2s/Manifest.mpd';

        video = document.querySelector('video');
        player = dashjs.MediaPlayer().create();
        player.initialize(video, url, true);
        outputContainer = document.getElementById('output-container');
        player.on('internalManifestLoaded', showEvent);
        await createControlBar(player, video, document.querySelector('.sample-video-wrapper'));
    }


    function showEvent(e) {
        outputContainer.innerHTML = "";
        for (var name in e) {

            if (typeof e[name] != 'object') {
                log('    ' + name + ': ' + e[name]);
            }
        }
        for (name in e) {
            if (typeof e[name] == 'object') {
                log('    ' + name + ':');
                for (name2 in e[name]) {
                    log('        ' + name2 + ': ' + JSON.stringify(e[name][name2]));
                }
            }
        }
    }

    function log(msg) {
        msg = msg.length > 90 ? msg.substring(0, 90) + '...' : msg;
        outputContainer.innerHTML += msg + '\n';
        outputContainer.scrollTop = outputContainer.scrollHeight;
    }
</script>
<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';
    initSamplePage({
        title: 'Live stream with MPD patching',
        description: 'Shows how dash.js handles live streams with updates to the manifest file provided via MPD patches.',
        category: 'Live',
        layout: 'custom',
        onInit: () => init()
    });
</script>
</body>
</html>
