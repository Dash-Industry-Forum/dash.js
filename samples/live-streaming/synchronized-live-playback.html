<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronized live playback</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">

</head>
<body>

<div class="sample-content-custom">
    <div class="row">
        <div class="col-md-4">
            <div class="sample-metrics">
                <div class="sample-metrics-header">Wall Clock reference time</div>
                <div class="sample-metrics-body">
                    <div class="sample-clock">
                        <span id="min"> </span><span id="sec"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-6">
            <div class="sample-metrics h-100">
                <div class="sample-metrics-header">2s segment, 10s target latency</div>
                <div class="sample-metrics-body">
                    <div class="sample-video-wrapper mb-2"><video id="video1" muted></video></div>
                    <div class="metric-row">
                        <span class="metric-label">Seconds behind live</span>
                        <span class="metric-value" id="video1delay">-</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Buffer length</span>
                        <span class="metric-value" id="video1buffer">-</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="sample-metrics h-100">
                <div class="sample-metrics-header">2s segment, 10s target latency</div>
                <div class="sample-metrics-body">
                    <div class="sample-video-wrapper mb-2"><video id="video2" muted></video></div>
                    <div class="metric-row">
                        <span class="metric-label">Seconds behind live</span>
                        <span class="metric-value" id="video2delay">-</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Buffer length</span>
                        <span class="metric-value" id="video2buffer">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script class="code">
    function init() {
        var player1, player2, video;
        var MPD_2S_SEGMENTS = 'https://livesim2.dashif.org/livesim2/testpic_2s/Manifest.mpd';
        var settings = {
            streaming: {
                delay: {
                    liveDelay: 10
                },
                liveCatchup: {
                    enabled: true
                }
            }
        }

        video = document.querySelector('#video1');
        player1 = dashjs.MediaPlayer().create();
        player1.initialize(video, MPD_2S_SEGMENTS, true);
        player1.updateSettings(settings);

        video = document.querySelector('#video2');
        player2 = dashjs.MediaPlayer().create();
        player2.initialize(video, MPD_2S_SEGMENTS, true);
        player2.updateSettings(settings);


        setInterval(function () {
            var d = new Date();
            var seconds = d.getSeconds();
            document.querySelector('#sec').innerHTML = (seconds < 10 ? '0' : '') + seconds;
            var minutes = d.getMinutes();
            document.querySelector('#min').innerHTML = (minutes < 10 ? '0' : '') + minutes + ':';
            for (var i = 1; i < 3; i++) {
                var p = eval('player' + i);
                document.querySelector('#video' + i + 'delay').innerHTML = Math.round((d.getTime() / 1000) - Number(p.timeAsUTC()));
                document.querySelector('#video' + i + 'buffer').innerHTML = p.getBufferLength() + 's';
            }


        }, 1000);

    }
</script>
<script type="module">
    import { initSamplePage } from '../lib/sample-template.js';
    initSamplePage({
        title: 'Synchronized live playback',
        description: 'This sample illustrates how to use the catchup mechanism to synchronize media playback of two videos.',
        category: 'Live',
        layout: 'custom',
        onInit: () => init()
    });
</script>
</body>
</html>
