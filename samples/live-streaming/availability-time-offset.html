<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live stream with availabilityTimeOffset</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <link href="../lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../lib/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../lib/sample.css" rel="stylesheet">
    <link href="../../contrib/controlbar/controlbar.css" rel="stylesheet">

</head>
<body>

<div class="sample-content-custom">
    <div class="row">
        <div class="col-md-6">
            <div class="sample-metrics">
                <div class="sample-metrics-header">Wall Clock reference time</div>
                <div class="sample-metrics-body">
                    <div class="sample-clock">
                        <span id="min"> </span><span id="sec"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-md-7">
            <div class="sample-video-wrapper"><video></video></div>
        </div>
        <div class="col-md-5">
            <div class="sample-metrics">
                <div class="sample-metrics-header">Debug information</div>
                <div class="sample-metrics-body">
                    <div class="metric-row">
                        <span class="metric-label">Seconds behind live</span>
                        <span class="metric-value" id="videoDelay">-</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Video Buffer</span>
                        <span class="metric-value" id="videoBuffer">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script class="code">
    async function init() {
        var video,
            player,
            url = " https://livesim2.dashif.org/livesim2/ato_10/testpic_2s/Manifest.mpd";

        setInterval(function () {
            if (player && player.isReady()) {
                var d = new Date();
                var seconds = d.getSeconds();
                document.querySelector('#sec').innerHTML = (seconds < 10 ? '0' : '') + seconds;
                var minutes = d.getMinutes();
                document.querySelector('#min').innerHTML = (minutes < 10 ? '0' : '') + minutes + ':';
                document.querySelector('#videoDelay').innerHTML = Math.round((d.getTime() / 1000) - Number(player.timeAsUTC()));
                document.querySelector('#videoBuffer').innerHTML = player.getBufferLength() + 's';
            }
        }, 1000);

        video = document.querySelector("video");
        player = dashjs.MediaPlayer().create();
        player.initialize(video, url, true);
        await createControlBar(player, video, document.querySelector('.sample-video-wrapper'));
    }
</script>
<script type="module">
    import { initSamplePage, createControlBar } from '../lib/sample-template.js';
    initSamplePage({
        title: 'Live stream with availabilityTimeOffset',
        description: 'Shows how dash.js handles live streams with an availabilityTimeOffset (ATO). In this case the ATO is set to 10 seconds. Consequently media segments are available 10 seconds earlier compared to their usual availability start time. As a result, the buffer level will be up to 10 seconds higher than the live latency.',
        category: 'Live',
        codeExpanded: true,
        layout: 'custom',
        onInit: () => init()
    });
</script>
</body>
</html>
