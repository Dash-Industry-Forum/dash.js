<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ESM Browserlist build</title>
    <script src="../common/layout.js"
            data-section="Builds"
            data-title="ESM Browserlist"
            data-description="Demonstrates the modern ESM build using <code>type=&quot;module&quot;</code> imports.">
    </script>
</head>
<body>
<template id="sample-content">
    <video controls></video>
</template>

<script data-sample type="module">
    import { MediaPlayer } from '../../dist/modern/esm/dash.all.min.js';

    const url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';
    const video = document.querySelector('video');
    const player = MediaPlayer().create();
    player.initialize(video, url, true);
</script>
</body>
</html>
