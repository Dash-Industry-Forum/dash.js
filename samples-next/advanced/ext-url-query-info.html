<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Flexible Insertion of URL Parameters</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../common/layout.js"
            data-section="Advanced"
            data-title="Flexible Insertion of URL Parameters"
            data-description="Demonstrates how to append query parameters to manifests and highlight them in fragment requests."
            data-layout="full-width">
    </script>
</head>
<body>
<template id="sample-content">
    <div class="row g-3">
        <div class="col-lg-6">
            <label for="manifestSelect" class="form-label">Manifest:</label>
            <input id="manifestSelect" value="https://livesim.dashif.org/livesim2/annexI_dashjs=rocks/testpic_6s/Manifest.mpd?dashjs=rocks"
                   type="text" class="form-control">
            <label for="queryParamsInput" class="form-label mt-3">Add Query Parameters to Manifest Request:</label>
            <input id="queryParamsInput" type="text" class="form-control" value="token=1234">
            <button id="loadButton" class="btn btn-primary mt-3">Load</button>
            <video controls class="mt-3"></video>
        </div>
        <div class="col-lg-6">
            <div class="form-floating">
                <div class="form-control trace-log" id="trace"></div>
                <label for="trace">Requests Made by Player</label>
            </div>
        </div>
    </div>
    <div class="row g-3 margin-top-row">
        <div class="col-12">
            <h5>Manifest Content:</h5>
            <pre id="manifestContent" class="border p-3"></pre>
        </div>
    </div>
</template>

<script data-sample>
    let player;

    function init() {
        const video = document.querySelector('video');
        const manifestSelect = document.getElementById('manifestSelect');
        const queryParamsInput = document.getElementById('queryParamsInput');
        const loadButton = document.getElementById('loadButton');

        player = dashjs.MediaPlayer().create();
        player.initialize(video, null, false);

        player.on(dashjs.MediaPlayer.events.MANIFEST_LOADED, () => {
            const manifestUrl = getManifestUrlWithQueryParams(manifestSelect.value, queryParamsInput.value);
            fetchManifest(manifestUrl);
        });

        player.on(dashjs.MediaPlayer.events.FRAGMENT_LOADING_COMPLETED, (event) => {
            const formattedUrl = highlightQueryParams(event.request.url);
            log(formattedUrl);
        });

        loadButton.addEventListener('click', updateManifestSource);
    }

    function updateManifestSource() {
        const manifestSelect = document.getElementById('manifestSelect');
        const queryParamsInput = document.getElementById('queryParamsInput');
        const url = getManifestUrlWithQueryParams(manifestSelect.value, queryParamsInput.value);
        player.attachSource(url);
        clearLog();
        clearManifestContent();
    }

    function getManifestUrlWithQueryParams(url, queryParams) {
        if (queryParams) {
            const separator = url.includes('?') ? '&' : '?';
            return url + separator + encodeURI(queryParams);
        }
        return url;
    }

    function highlightQueryParams(url) {
        const parts = url.split('?');
        if (parts.length > 1) {
            const baseUrl = parts[0];
            const queryParams = parts[1];
            return `${baseUrl}?<strong>${queryParams}</strong>`;
        }
        return url;
    }

    function fetchManifest(url) {
        fetch(url)
            .then((response) => {
                if (!response.ok) {
                    throw new Error(`Network response was not ok ${response.statusText}`);
                }
                return response.text();
            })
            .then((data) => {
                displayManifestContent(data);
            })
            .catch((error) => {
                console.error('There has been a problem with your fetch operation:', error);
            });
    }

    function displayManifestContent(content) {
        const manifestPanel = document.getElementById('manifestContent');
        manifestPanel.textContent = content;
    }

    function log(msg) {
        const tracePanel = document.getElementById('trace');
        const logEntry = document.createElement('div');
        logEntry.innerHTML = msg;
        tracePanel.appendChild(logEntry);
        tracePanel.scrollTop = tracePanel.scrollHeight;
        console.log(msg);
    }

    function clearLog() {
        document.getElementById('trace').innerHTML = '';
    }

    function clearManifestContent() {
        document.getElementById('manifestContent').textContent = '';
    }
</script>
</body>
</html>
