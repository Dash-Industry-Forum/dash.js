<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Autoplay browser policy</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../common/layout.js"
            data-section="Advanced"
            data-title="Autoplay browser policy"
            data-description="Handles autoplay restrictions by retrying playback muted when the browser blocks auto-play.">
    </script>
</head>
<body>
<template id="sample-content">
    <video controls></video>
</template>

<script data-sample>
    function init() {
        const url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';
        const video = document.querySelector('video');
        const player = dashjs.MediaPlayer().create();

        player.on(dashjs.MediaPlayer.events.PLAYBACK_NOT_ALLOWED, () => {
            video.muted = true;
            player.initialize(video, url, true);
        });

        player.initialize(video, url, true);
    }
</script>
</body>
</html>
