<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Custom capabilities filter</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../common/layout.js"
            data-section="Advanced"
            data-title="Custom capabilities filter"
            data-description="Filters representations using a custom capability function (e.g., limit video height).">
    </script>
</head>
<body>
<template id="sample-content">
    <video controls></video>
</template>

<script data-sample>
    function init() {
        const url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';

        const filterCapabilities = (representation) => {
            if (representation.mimeType === 'video/mp4') {
                return representation.height <= 720;
            }
            return true;
        };

        const video = document.querySelector('video');
        const player = dashjs.MediaPlayer().create();

        player.registerCustomCapabilitiesFilter(filterCapabilities);
        player.initialize(video, url, true);
    }
</script>
</body>
</html>
