<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CMCD Reporting from manifest</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../common/layout.js"
            data-section="Advanced"
            data-title="CMCD Reporting from manifest"
            data-description="Configures CMCD using MPD parameters and optionally overrides them via player settings."
            data-layout="full-width">
    </script>
</head>
<body>
<template id="sample-content">
    <div class="row g-3">
        <div class="col-lg-12">
            <div class="input-group">
                <div class="form-check me-3">
                    <input class="form-check-input" type="checkbox" id="applyParametersFromMpd" checked>
                    <label class="form-check-label" for="applyParametersFromMpd">applyParametersFromMpd</label>
                </div>
                <div class="form-check me-3">
                    <input class="form-check-input" type="checkbox" id="cmcdJS">
                    <label class="form-check-label" for="cmcdJS">CMCD from player settings</label>
                </div>
                <button type="button" id="load-button" class="btn btn-success">Load MPD</button>
            </div>
        </div>
    </div>
    <div class="row g-3 margin-top-row">
        <div class="col-lg-6">
            <video controls muted></video>
        </div>
        <div class="col-lg-6">
            <div class="h-100 p-4 border rounded-3">
                <h5>CDN Selection</h5>
                <div id="cdn-selection-container"></div>
                <h5 class="mt-3">Location Selection</h5>
                <div id="location-selection-container"></div>
            </div>
        </div>
    </div>
    <div class="row g-3 margin-top-row">
        <div class="col-lg-6">
            <div class="form-floating">
                <textarea class="form-control trace-log" placeholder="Sent CMCD data will be displayed here" id="trace"></textarea>
                <label for="trace">CMCD Data</label>
            </div>
        </div>
        <div class="col-lg-6">
            <p class="fw-semibold mb-2">MPD Source</p>
            <div id="mpd-output" class="border p-3"></div>
        </div>
    </div>
    <div class="row g-3 margin-top-row">
        <div class="col-lg-6">
            <div class="h-100 p-4 border rounded-3">
                <h5>Fragment Requests</h5>
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                        <tr>
                            <th scope="col">Type</th>
                            <th scope="col">Service Location</th>
                            <th scope="col">Request URL</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>Audio</td>
                            <td id="audio-service-location"></td>
                            <td id="audio-request-url"></td>
                        </tr>
                        <tr>
                            <td>Video</td>
                            <td id="video-service-location"></td>
                            <td id="video-request-url"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="h-100 p-4 border rounded-3">
                <h5>Manifest Requests</h5>
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                        <tr>
                            <th scope="col">Service Location</th>
                            <th scope="col">Request URL</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td id="manifest-service-location"></td>
                            <td id="manifest-request-url"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-3 margin-top-row">
        <div class="col-12">
            <div class="h-100 p-4 border rounded-3">
                <h5>Steering Data</h5>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th scope="col">Attribute</th>
                            <th scope="col">Value</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>Timestamp</td>
                            <td id="steering-request-timestamp"></td>
                        </tr>
                        <tr>
                            <td>Request URL</td>
                            <td><span id="steering-request-url"></span></td>
                        </tr>
                        <tr>
                            <td>Response - Version</td>
                            <td><span id="steering-version"></span></td>
                        </tr>
                        <tr>
                            <td>Response - Reload URI</td>
                            <td><span id="steering-reload-uri"></span></td>
                        </tr>
                        <tr>
                            <td>Response - Pathway Priority</td>
                            <td><span id="steering-pathway-priority"></span></td>
                        </tr>
                        <tr>
                            <td>Response - Pathway Clones</td>
                            <td><pre class="mb-0"><span id="steering-pathway-cloning"></span></pre></td>
                        </tr>
                        <tr>
                            <td>Response - TTL</td>
                            <td><span id="steering-ttl"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</template>

<template id="sample-description-extra">
    <div class="bd-callout mt-3">
        <p class="mb-2">If <code>applyParametersFromMpd</code> is enabled, CMCD settings from the MPD override player
            settings.</p>
        <p class="mb-0">Disable it to use settings configured in the player instead.</p>
    </div>
</template>

<script data-sample>
    const cmcdDataGenerated = dashjs.MetricsReporting.events.CMCD_DATA_GENERATED;
    const cmcdModeQuery = 'query';
    const cmcdModeHeader = 'header';
    let player;
    let currentSelectedServiceLocation = {};
    let cdnSelectionImgDomElements = {};
    let locationSelectionImgDomElements = {};

    function init() {
        player = dashjs.MediaPlayer().create();
        document.getElementById('load-button').addEventListener('click', () => {
            load();
            loadMpdContent();
        });
        player.initialize(document.querySelector('video'), null, true);

        player.on(dashjs.MediaPlayer.events.FRAGMENT_LOADING_STARTED, onFragmentLoadingStarted, null);
        player.on(dashjs.MediaPlayer.events.MANIFEST_LOADING_STARTED, onManifestLoadingStarted, null);
        player.on(dashjs.MediaPlayer.events.CONTENT_STEERING_REQUEST_COMPLETED, onContentSteeringRequestCompleted, null);
        player.on(dashjs.MediaPlayer.events.BASE_URLS_UPDATED, onBaseUrlsUpdated, null);
        player.on(dashjs.MediaPlayer.events.MANIFEST_LOADED, onManifestLoaded, null);
        player.on(cmcdDataGenerated, handleCmcdDataGeneratedEvent);
    }

    function handleCmcdDataGeneratedEvent(event) {
        log(`type: ${event.mediaType}`);
        log(`file: ${event.url.split('/').pop()}`);
        const mode = event.headers ? cmcdModeHeader : cmcdModeQuery;
        const data = mode === cmcdModeHeader ? getKeysForHeaderMode(event) : getKeysForQueryMode(event);
        const keys = Object.keys(data).sort();
        keys.forEach((key) => {
            log(`${key.padEnd(4)}: ${event.cmcdData[key]}`);
        });
        log('');
    }

    function getKeysForQueryMode(event) {
        const cmcdData = {};
        extractKeyValuePairs(event.cmcdString, cmcdData);
        return cmcdData;
    }

    function getKeysForHeaderMode(event) {
        const cmcdData = {};
        Object.keys(event.headers).forEach((key) => {
            extractKeyValuePairs(event.headers[key], cmcdData);
        });
        return cmcdData;
    }

    function extractKeyValuePairs(cmcdString, cmcdData) {
        if (cmcdString === '') {
            return;
        }
        cmcdString.split(',').forEach((keyValuePair) => {
            const data = keyValuePair.split('=');
            cmcdData[data[0]] = data[1];
        });
    }

    function log(msg) {
        const safeMsg = msg.length > 200 ? `${msg.substring(0, 200)}...` : msg;
        const tracePanel = document.getElementById('trace');
        tracePanel.value += `${safeMsg}\n`;
        tracePanel.scrollTop = tracePanel.scrollHeight;
        console.log(safeMsg);
    }

    function load() {
        const applyParametersFromMpd = document.getElementById('applyParametersFromMpd').checked;
        const cmcdJS = document.getElementById('cmcdJS').checked;
        const url = './mpds/basic-cmcd-config.mpd';

        player.updateSettings({
            streaming: {
                cmcd: {
                    applyParametersFromMpd,
                    enabled: cmcdJS,
                    sid: 'b248658d-1d1a-4039-91d0-8c08ba597da5',
                    cid: '21cf726cfe3d937b5f974f72bb5bd06a',
                    mode: cmcdModeQuery,
                    includeInRequests: ['mpd', 'segment', 'steering'],
                    enabledKeys: ['br', 'd', 'ot', 'tb', 'bl', 'dl', 'mtp', 'nor', 'nrr', 'su', 'bs', 'rtp', 'cid', 'pr', 'sf', 'sid', 'st', 'v']
                }
            }
        });
        player.attachSource(url);
        player.updateSettings({});
    }

    function onFragmentLoadingStarted(e) {
        try {
            if (e && e.mediaType && (e.mediaType === 'video' || e.mediaType === 'audio') && e.request) {
                if (e.request.serviceLocation) {
                    const element = document.getElementById(`${e.mediaType}-service-location`);
                    element.innerText = e.request.serviceLocation;
                    if (!currentSelectedServiceLocation[e.mediaType] || currentSelectedServiceLocation[e.mediaType] !== e.request.serviceLocation) {
                        currentSelectedServiceLocation[e.mediaType] = e.request.serviceLocation;
                        serviceLocationChanged(currentSelectedServiceLocation, cdnSelectionImgDomElements);
                    }
                }
                if (e.request.url) {
                    const element = document.getElementById(`${e.mediaType}-request-url`);
                    element.innerText = e.request.url;
                }
            }
        } catch (err) {
            console.error(err);
        }
    }

    function serviceLocationChanged(selectedServiceLocation, domElements) {
        const activeServiceLocations = Object.keys(selectedServiceLocation).reduce((acc, key) => {
            acc[selectedServiceLocation[key]] = true;
            return acc;
        }, {});

        Object.keys(domElements).forEach((key) => {
            const elem = domElements[key];
            if (activeServiceLocations[key]) {
                elem.setAttribute('src', 'img/server-active.svg');
            } else {
                elem.setAttribute('src', 'img/server.svg');
            }
        });
    }

    function onBaseUrlsUpdated(e) {
        if (!e || !e.baseUrls || e.baseUrls.length === 0) {
            return;
        }
        const divContainer = document.getElementById('cdn-selection-container');
        e.baseUrls.forEach((baseUrl) => {
            if (baseUrl.serviceLocation) {
                const existingElement = document.getElementById(`cdn-selection-${baseUrl.serviceLocation}`);
                if (!existingElement) {
                    const spanContainer = document.createElement('span');
                    spanContainer.setAttribute('id', `cdn-selection-${baseUrl.serviceLocation}`);
                    const figure = document.createElement('figure');
                    figure.setAttribute('class', 'cdn-selection');
                    const img = document.createElement('img');
                    img.setAttribute('src', 'img/server.svg');
                    img.setAttribute('class', 'figure-img img-fluid cdn-selection');
                    const figCaption = document.createElement('figcaption');
                    figCaption.setAttribute('class', 'figure-caption');
                    figCaption.appendChild(document.createTextNode(`${baseUrl.serviceLocation}`));
                    figure.appendChild(img);
                    figure.appendChild(figCaption);
                    spanContainer.appendChild(figure);
                    divContainer.appendChild(spanContainer);
                    cdnSelectionImgDomElements[baseUrl.serviceLocation] = img;
                }
            }
        });
    }

    function onManifestLoaded() {
        const locations = player.getAvailableLocations();
        if (!locations || locations.length === 0) {
            return;
        }
        const divContainer = document.getElementById('location-selection-container');
        locations.forEach((location) => {
            if (location.serviceLocation) {
                const existingElement = document.getElementById(`cdn-selection-${location.serviceLocation}`);
                if (!existingElement) {
                    const spanContainer = document.createElement('span');
                    spanContainer.setAttribute('id', `cdn-selection-${location.serviceLocation}`);
                    const figure = document.createElement('figure');
                    figure.setAttribute('class', 'cdn-selection');
                    const img = document.createElement('img');
                    img.setAttribute('src', 'img/server.svg');
                    img.setAttribute('class', 'figure-img img-fluid cdn-selection');
                    const figCaption = document.createElement('figcaption');
                    figCaption.setAttribute('class', 'figure-caption');
                    figCaption.appendChild(document.createTextNode(`${location.serviceLocation}`));
                    figure.appendChild(img);
                    figure.appendChild(figCaption);
                    spanContainer.appendChild(figure);
                    divContainer.appendChild(spanContainer);
                    locationSelectionImgDomElements[location.serviceLocation] = img;
                }
            }
        });
    }

    function onManifestLoadingStarted(e) {
        try {
            if (e.request.url) {
                document.getElementById('manifest-request-url').innerText = e.request.url;
            }
            const slElement = document.getElementById('manifest-service-location');
            if (e.request.serviceLocation) {
                slElement.innerText = e.request.serviceLocation;
                serviceLocationChanged({ manifest: e.request.serviceLocation }, locationSelectionImgDomElements);
            } else {
                slElement.innerText = '';
            }
        } catch (err) {
            console.error(err);
        }
    }

    function onContentSteeringRequestCompleted(e) {
        try {
            if (e) {
                document.getElementById('steering-request-timestamp').innerText = new Date().toISOString();
                if (e.url) {
                    document.getElementById('steering-request-url').innerText = decodeURIComponent(e.url);
                }
                if (e.currentSteeringResponseData) {
                    document.getElementById('steering-version').innerText = e.currentSteeringResponseData.version;
                    document.getElementById('steering-ttl').innerText = e.currentSteeringResponseData.ttl;
                    document.getElementById('steering-reload-uri').innerText = e.currentSteeringResponseData.reloadUri;
                    document.getElementById('steering-pathway-priority').innerText = e.currentSteeringResponseData.pathwayPriority.toString();
                    document.getElementById('steering-pathway-cloning').innerText = JSON.stringify(e.currentSteeringResponseData.pathwayClones, null, '\t');
                }
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function loadMpdContent() {
        const mpdOutput = document.getElementById('mpd-output');
        mpdOutput.innerHTML = '';
        try {
            const url = './mpds/basic-cmcd-config.mpd';
            const mpdContent = await fetch(url).then((response) => response.text());
            const preElement = document.createElement('pre');
            const codeElement = document.createElement('code');
            codeElement.textContent = mpdContent;
            preElement.appendChild(codeElement);
            mpdOutput.appendChild(preElement);
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(codeElement);
            }
        } catch (error) {
            console.error('Error loading .mpd file', error);
        }
    }
</script>
</body>
</html>
