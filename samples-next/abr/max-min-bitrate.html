<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Max/min bitrate</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../common/layout.js"
            data-section="ABR"
            data-title="Max/min bitrate"
            data-description="Shows how to constrain the ABR bitrate range by setting minimum and maximum values.">
    </script>
</head>
<body>
<template id="sample-content">
    <video controls></video>
</template>

<script data-sample>
    function init() {
        const url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';
        const video = document.querySelector('video');
        const player = dashjs.MediaPlayer().create();

        player.updateSettings({
            streaming: {
                abr: {
                    maxBitrate: {
                        audio: -1,
                        video: 5000
                    },
                    minBitrate: {
                        audio: -1,
                        video: 2000
                    }
                }
            }
        });

        player.initialize(video, url, true);
    }
</script>
</body>
</html>
