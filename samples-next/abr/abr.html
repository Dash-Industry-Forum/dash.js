<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Configuration of ABR Rules</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../common/layout.js"
            data-section="ABR"
            data-title="Configuration of ABR Rules"
            data-description="Shows how to enable or disable specific ABR decision rules. This demo enables
                throughput-based logic and the InsufficientBufferRule, while disabling others.">
    </script>
</head>
<body>
<template id="sample-content">
    <video controls></video>
</template>

<script data-sample>
    function init() {
        const url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';
        const video = document.querySelector('video');
        const player = dashjs.MediaPlayer().create();

        player.updateSettings({
            streaming: {
                abr: {
                    rules: {
                        throughputRule: { active: true },
                        bolaRule: { active: false },
                        insufficientBufferRule: { active: true },
                        switchHistoryRule: { active: false },
                        droppedFramesRule: { active: false },
                        abandonRequestsRule: { active: false }
                    }
                }
            }
        });

        player.initialize(video, url, true);
    }
</script>
</body>
</html>
