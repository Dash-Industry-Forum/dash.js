<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mediaplayer only</title>
    <script src="../../dist/modern/umd/dash.mediaplayer.debug.js"></script>
    <script src="../common/layout.js"
            data-section="Module builds"
            data-title="Mediaplayer only"
            data-description="Demonstrates the mediaplayer-only build which excludes DRM support.">
    </script>
</head>
<body>
<template id="sample-content">
    <video controls></video>
</template>

<script data-sample>
    function init() {
        const url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';
        const video = document.querySelector('video');
        const player = dashjs.MediaPlayer().create();
        player.initialize(video, url, false);
    }
</script>
</body>
</html>
