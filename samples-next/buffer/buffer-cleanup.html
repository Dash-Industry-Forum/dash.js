<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Buffer cleanup</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../common/layout.js"
            data-section="Buffer"
            data-title="Buffer cleanup"
            data-description="Shows how to configure buffer pruning. This sample sets
                <code>bufferPruningInterval</code> and <code>bufferToKeep</code> to control cleanup behavior.">
    </script>
</head>
<body>
<template id="sample-content">
    <video controls></video>
</template>

<script data-sample>
    function init() {
        const url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';
        const video = document.querySelector('video');
        const player = dashjs.MediaPlayer().create();

        player.updateSettings({
            streaming: {
                buffer: {
                    bufferPruningInterval: 10,
                    bufferToKeep: 20
                }
            }
        });

        player.initialize(video, url, true);
    }
</script>
</body>
</html>
