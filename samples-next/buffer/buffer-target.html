<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Buffer target</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../common/layout.js"
            data-section="Buffer"
            data-title="Buffer target"
            data-description="Shows how to configure buffer targets for default and long-form content. This sample
                sets separate values for <code>bufferTimeAtTopQuality</code> and
                <code>bufferTimeAtTopQualityLongForm</code>, as well as default buffer time.">
    </script>
</head>
<body>
<template id="sample-content">
    <video controls></video>
</template>

<script data-sample>
    function init() {
        const url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';
        const video = document.querySelector('video');
        const player = dashjs.MediaPlayer().create();

        player.updateSettings({
            streaming: {
                buffer: {
                    bufferTimeAtTopQuality: 30,
                    bufferTimeAtTopQualityLongForm: 60,
                    bufferTimeDefault: 12,
                    longFormContentDurationThreshold: 600
                }
            }
        });

        player.initialize(video, url, true);
    }
</script>
</body>
</html>
