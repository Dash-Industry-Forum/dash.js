<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Initial buffer target</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../common/layout.js"
            data-section="Buffer"
            data-title="Initial buffer target"
            data-description="Shows how to configure the initial buffer level using
                <code>initialBufferLevel</code>.">
    </script>
</head>
<body>
<template id="sample-content">
    <video controls></video>
</template>

<script data-sample>
    function init() {
        const url = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';
        const video = document.querySelector('video');
        const player = dashjs.MediaPlayer().create();

        player.updateSettings({
            streaming: {
                buffer: {
                    initialBufferLevel: 12
                }
            }
        });

        player.initialize(video, url, true);
    }
</script>
</body>
</html>
