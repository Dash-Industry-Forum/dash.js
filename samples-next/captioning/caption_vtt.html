<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WebVTT example</title>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../common/layout.js"
            data-section="Subtitles and Captions"
            data-title="Caption VTT"
            data-description="Shows how content with VTT captions can be played back by the dash.js player."
            data-layout="default">
    </script>
</head>
<body>
<template id="sample-description-extra">
    <p>Note: This sample will only work when using http as the subtitles are not hosted via https.</p>
</template>

<template id="sample-content">
    <video controls></video>
</template>

<script data-sample>
    function init() {
        const url = 'https://dash.akamaized.net/akamai/test/caption_test/ElephantsDream/elephants_dream_480p_heaac5_1_https.mpd';
        const video = document.querySelector('video');
        const player = dashjs.MediaPlayer({}).create();
        player.initialize(video, url, true);
    }
</script>
</body>
</html>
