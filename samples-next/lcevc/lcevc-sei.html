<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MPEG-5 LCEVC SEI</title>
    <script src="https://unpkg.com/lcevc_dec.js@latest/dist/lcevc_dec.min.js"></script>
    <script src="../../dist/modern/umd/dash.all.debug.js"></script>
    <script src="../../contrib/akamai/controlbar/ControlBar.js"></script>
    <script src="../common/player-utils.js"></script>
    <link rel="stylesheet" href="../../contrib/akamai/controlbar/controlbar.css">
    <script src="../common/layout.js"
            data-section="MPEG-5 Part 2 - LCEVC"
            data-title="MPEG-5 LCEVC SEI"
            data-description="Decodes LCEVC enhancements carried as SEI in the base video track."
            data-layout="full-width">
    </script>
</head>
<body>
<template id="sample-content">
    <div class="dash-video-player" id="player-container"></div>
    <canvas id="lcevc-canvas" class="mt-3"></canvas>
</template>

<template id="sample-description-extra">
    <div class="bd-callout mt-3">
        <p class="mb-0">Enhancements are rendered on the canvas while the HTML5 video element stays hidden.</p>
    </div>
</template>

<script data-sample>
    dashjs.Extensions = {
        ...dashjs.Extensions,
        useLcevc: function useLcevc(player) {
            if (!player) {
                throw new TypeError('The provided Dash.js player instance was null or undefined.');
            }
            const { LCEVCdec } = window;
            if (!LCEVCdec) {
                throw new TypeError('LCEVC Decoder Libraries could not be loaded.');
            }

            player.attachLcevc = function attachLcevc(media, canvas, lcevcDecConfig) {
                player.LCEVCdec = new LCEVCdec.LCEVCdec(media, canvas, lcevcDecConfig);
            };

            const enableAutoRenderMode = 1;

            player.on(dashjs.MediaPlayer.events.FRAGMENT_LOADING_COMPLETED, (event) => {
                if (player.LCEVCdec && event.mediaType === 'video') {
                    player.LCEVCdec.appendBuffer(event.response, 'video', event.request.representation.index);
                    player.LCEVCdec.setLevelSwitching(event.request.representation.index, enableAutoRenderMode);
                }
            });
        }
    };

    function init() {
        const url = 'https://d3mfda3gpj3dw1.cloudfront.net/vn9s0p86SVbJorX6/master.mpd';
        const container = document.getElementById('player-container');
        container.innerHTML = DashjsSamples.getControlBarMarkup();

        const video = container.querySelector('video');
        const canvas = document.getElementById('lcevc-canvas');
        const player = dashjs.MediaPlayer().create();

        video.style.display = 'none';

        const lcevcDecConfig = {};
        LCEVCdec.ready.then(() => {
            dashjs.Extensions.useLcevc(player);
            player.attachLcevc(video, canvas, lcevcDecConfig);
            player.initialize(video, url, false);
            const controlbar = new ControlBar(player);
            controlbar.initialize();
        });
    }
</script>
</body>
</html>
