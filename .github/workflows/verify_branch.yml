name: verify_branch

on:
    push:
        branches:
            - '**'
            - '!master'
            - '!development'
            - '!v4_main'
            - '!v4_development'

jobs:
    build_and_unit_test:
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v4
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
            -   name: Build and run unit tests
                run: npm run build
