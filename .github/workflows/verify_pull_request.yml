name: verify_pull_request

on:
    pull_request:
        branches:
            - 'development'
        paths-ignore:
            - '*.md'
            - 'docs/**'
            - 'proposals/**'
            - 'LICENSES/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    validate_and_unit_test:
        runs-on: ubuntu-24.04
        steps:
            # actions/checkout on pull_request events checks out the merge commit (refs/pull/<PR#>/merge),
            # which is the PR branch merged into the target branch (development). This ensures the build
            # and tests verify the code as it would look after merging.
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
            -   name: Validate and run unit tests
                run: npm run ci:verify

    build_modern_artifact:
        runs-on: ubuntu-24.04
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
            -   name: Build modern bundle
                run: npm run webpack-build-modern
            -   name: Upload modern dist artifacts
                uses: actions/upload-artifact@v4
                with:
                    name: dist-modern
                    path: dist/
                    retention-days: 1

    build_legacy_bundle:
        needs: validate_and_unit_test
        runs-on: ubuntu-24.04
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
            -   name: Build legacy bundle
                run: npm run webpack-build-legacy
            -   name: Upload legacy dist artifacts
                uses: actions/upload-artifact@v4
                with:
                    name: dist-legacy
                    path: dist/
                    retention-days: 1

    run_compliance_tests:
        needs:
            - build_modern_artifact
            - build_legacy_bundle
        runs-on: ubuntu-24.04
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
            -   name: Download modern dist artifacts
                uses: actions/download-artifact@v4
                with:
                    name: dist-modern
                    path: dist/
            -   name: Download legacy dist artifacts
                uses: actions/download-artifact@v4
                with:
                    name: dist-legacy
                    path: dist/
            -   name: Run compliance tests
                run: npm run test:compliance
            # --no-build packs the downloaded dist artifacts as-is instead of rebuilding.
            # Must run AFTER test:compliance: both steps share vite-consumer/node_modules/dashjs.
            # test:compliance:vite installs the "file:" source dependency (CJS-in-ESM check,
            # see #5026), then this step overwrites it with the tarball install. Reordering
            # silently loses one of the two coverages.
            -   name: Verify npm package tarball
                run: node test/package/verify-package.mjs --no-build

    run_functional_test_single_stream_lambdatest:
        if: github.event.pull_request.head.repo.fork == false
        needs:
            - validate_and_unit_test
            - build_modern_artifact
        runs-on: ubuntu-24.04
        steps:
            # actions/checkout on pull_request events checks out the merge commit (refs/pull/<PR#>/merge),
            # which is the PR branch merged into the target branch (development). This ensures the
            # functional tests verify the code as it would look after merging.
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
            -   name: Install karma-webdriver-launcher
                run: npm install karma-webdriver-launcher
            -   name: Download dist artifacts
                uses: actions/download-artifact@v4
                with:
                    name: dist-modern
                    path: dist/
            -   name: Start Tunnel
                uses: LambdaTest/LambdaTest-tunnel-action@v2
                id: tunnel
                with:
                    user: ${{ secrets.LT_USERNAME }}
                    accessKey: ${{ secrets.LT_ACCESS_KEY }}
                    tunnelName: "dashjs-tunnel-${{github.run_number}}"
            -   name: Run functional tests on LambdaTest
                env:
                    LT_USERNAME: ${{ secrets.LT_USERNAME }}
                    LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
                run: node_modules/karma/bin/karma start test/functional/config/karma.functional.conf.cjs --configfile=lambdatest --streamsfile=single
