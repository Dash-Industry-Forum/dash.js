name: verify_pull_request

on:
    pull_request:
        branches:
            - 'development'
        paths-ignore:
            - '*.md'
            - 'docs/**'
            - 'proposals/**'
            - 'LICENSES/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate_and_unit_test:
        runs-on: ubuntu-24.04
        steps:
            # actions/checkout on pull_request events checks out the merge commit (refs/pull/<PR#>/merge),
            # which is the PR branch merged into the target branch (development). This ensures the build
            # and tests verify the code as it would look after merging.
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
                    # Also fetch the base side of the merge commit (HEAD^1), which the coverage
                    # summary diffs against to report coverage of the changed lines.
                    fetch-depth: 2
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
                with:
                    install-browsers: 'true'
            -   name: Validate and run unit tests
                run: npm run ci:verify
            # Coverage is measured in Chromium only. Fails when total coverage drops below the floor in vite.config.js.
            -   name: Unit test coverage
                id: coverage
                run: npm run test:coverage
            # Writes the job summary. Fails when less than 80% of the changed executable lines in src/ are covered.
            # Skipped when the coverage step did not run, so an earlier failure is not reported twice.
            -   name: Coverage summary
                if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
                run: node test/unit/config/coverage-summary.mjs --min-changed=80
            -   name: Upload coverage report
                if: ${{ !cancelled() }}
                continue-on-error: true
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: unit-test-coverage
                    path: test/unit/results/coverage/
                    if-no-files-found: ignore
                    retention-days: 7

    build_modern_artifact:
        runs-on: ubuntu-24.04
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
            -   name: Build modern bundle
                run: npm run webpack-build-modern
            -   name: Upload modern dist artifacts
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: dist-modern
                    path: dist/
                    retention-days: 1

    build_legacy_bundle:
        needs: validate_and_unit_test
        runs-on: ubuntu-24.04
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
            -   name: Build legacy bundle
                run: npm run webpack-build-legacy
            -   name: Upload legacy dist artifacts
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: dist-legacy
                    path: dist/
                    retention-days: 1

    run_compliance_tests:
        needs:
            - build_modern_artifact
            - build_legacy_bundle
        runs-on: ubuntu-24.04
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
            -   name: Download modern dist artifacts
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
                with:
                    name: dist-modern
                    path: dist/
            -   name: Download legacy dist artifacts
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
                with:
                    name: dist-legacy
                    path: dist/
            -   name: Run compliance tests
                run: npm run test:compliance

    run_functional_test_single_stream_browserstack:
        if: github.event.pull_request.head.repo.fork == false
        needs:
            - validate_and_unit_test
            - build_modern_artifact
        runs-on: ubuntu-24.04
        steps:
            # actions/checkout on pull_request events checks out the merge commit (refs/pull/<PR#>/merge),
            # which is the PR branch merged into the target branch (development). This ensures the
            # functional tests verify the code as it would look after merging.
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   name: Setup dash.js
                uses: ./.github/actions/setup-dashjs
            -   name: Download dist artifacts
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
                with:
                    name: dist-modern
                    path: dist/
            -   name: Run functional tests on BrowserStack
                # karma-browserstack-launcher opens the BrowserStack Local tunnel itself
                env:
                    BROWSERSTACK_USER: ${{ secrets.BROWSERSTACK_USER }}
                    BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
                run: node_modules/karma/bin/karma start test/functional/config/karma.functional.conf.cjs --configfile=browserstack --streamsfile=single
