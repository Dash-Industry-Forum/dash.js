# Builds the VitePress documentation site in docs/site and deploys it to GitHub Pages
name: deploy_docs

on:
  push:
    branches:
      - development
    paths:
      - 'docs/site/**'
      - 'src/**'
      - '.github/workflows/deploy_docs.yml'

  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with VitePress
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: DOCS_BASE="${BASE_PATH:-}/" npm run docs:build
      - name: Generate API reference (JSDoc)
        run: npx jsdoc -c build/jsdoc/jsdoc_conf.json -d docs/site/.vitepress/dist/api
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Only the job that deploys to GitHub Pages gets write permissions
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
